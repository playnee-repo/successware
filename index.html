<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Successware</title>
    <script>
      (function () {
        var mode = localStorage.getItem('theme-mode');
        var color = localStorage.getItem('theme-color');
        var classes = [];
        if (mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          classes.push('dark');
        }
        var effectiveColor = color || 'slate';
        if (effectiveColor !== 'default') classes.push('theme-' + effectiveColor);
        if (classes.length) document.documentElement.className = classes.join(' ');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
